<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>SiteSpot B2B</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg: #07101d; --panel: #0d1828; --panel-2: #111f33; --panel-3: #172842; --line: rgba(255,255,255,.1); --line-2: rgba(255,255,255,.18);
      --text: #f3f6fb; --muted: #97a6bc; --blue: #4e8cff; --cyan: #42d9ff; --green: #43d7a3; --yellow: #ffc75a; --red: #ff7b82; --purple: #a88cff;
      --on-accent: #06101d; --shadow: 0 18px 60px rgba(0,0,0,.28); --radius: 16px;
      --green-bg: rgba(67,215,163,.12); --yellow-bg: rgba(255,199,90,.12); --red-bg: rgba(255,123,130,.12); --blue-bg: rgba(78,140,255,.14);
      --mail-bg: #0a1423;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f6fb; --panel: #ffffff; --panel-2: #f6f8fc; --panel-3: #e9eef7; --line: rgba(10,25,50,.12); --line-2: rgba(10,25,50,.22);
        --text: #0e1a2e; --muted: #57667d; --blue: #1f5fe0; --cyan: #0a86ad; --green: #0b8a64; --yellow: #8a5a00; --red: #c4313c; --purple: #6b4bd0;
        --on-accent: #ffffff; --shadow: 0 12px 40px rgba(20,40,80,.1);
        --green-bg: rgba(11,138,100,.1); --yellow-bg: rgba(200,140,0,.13); --red-bg: rgba(196,49,60,.09); --blue-bg: rgba(31,95,224,.09);
        --mail-bg: #fbfcfe;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--cyan); text-underline-offset: 2px; }
    h1, h2, h3, p { margin: 0; }
    .shell { width: min(1280px, calc(100% - 32px)); margin: 0 auto; padding: 0 0 80px; }

    /* horní lišta */
    .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .top-in { width: min(1280px, calc(100% - 32px)); margin: 0 auto; display: flex; align-items: center; gap: 14px; height: 58px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; color: var(--text); text-decoration: none; }
    .mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--blue), var(--cyan)); color: var(--on-accent); font-weight: 900; font-size: 14px; }
    .crumbs { color: var(--muted); display: flex; gap: 8px; align-items: center; min-width: 0; font-size: 14px; }
    .crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--text); }
    .crumbs b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .grow { flex: 1; }
    .meta { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-bg); }
    .dot.stale { background: var(--yellow); box-shadow: 0 0 0 4px var(--yellow-bg); } .dot.err { background: var(--red); box-shadow: 0 0 0 4px var(--red-bg); }

    /* tlačítka */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; line-height: 1.2; min-height: 38px; transition: background .15s, border-color .15s, transform .05s; }
    .btn:hover { background: var(--panel-3); } .btn:active { transform: translateY(1px); }
    .btn:focus-visible, .tab:focus-visible, .card-link:focus-visible, summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .btn.primary { background: var(--green); border-color: transparent; color: var(--on-accent); } .btn.primary:hover { filter: brightness(1.08); }
    .btn.blue { background: var(--blue); border-color: transparent; color: var(--on-accent); }
    .btn.danger { color: var(--red); } .btn.ghost { background: transparent; }
    .btn.sm { padding: 5px 10px; min-height: 30px; font-size: 13px; border-radius: 8px; }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }

    /* odznaky */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); white-space: nowrap; }
    .badge.green { background: var(--green-bg); color: var(--green); border-color: transparent; } .badge.yellow { background: var(--yellow-bg); color: var(--yellow); border-color: transparent; }
    .badge.red { background: var(--red-bg); color: var(--red); border-color: transparent; } .badge.blue { background: var(--blue-bg); color: var(--blue); border-color: transparent; }
    .badge.test { background: var(--yellow-bg); color: var(--yellow); border-color: transparent; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }

    /* přehled */
    .hero { padding: 34px 0 10px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
    .hero h1 { font-size: clamp(1.7rem, 3.6vw, 2.5rem); letter-spacing: -.01em; line-height: 1.05; font-family: "Clash Display", Inter, sans-serif; }
    .hero p { color: var(--muted); margin-top: 8px; max-width: 640px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
    .attn { margin: 22px 0; padding: 6px; }
    .attn h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 12px 14px 6px; font-weight: 700; }
    .attn a.row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; text-decoration: none; color: var(--text); }
    .attn a.row:hover { background: var(--panel-2); }
    .attn .ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
    .attn .ico.green { background: var(--green-bg); color: var(--green); } .attn .ico.red { background: var(--red-bg); color: var(--red); } .attn .ico.yellow { background: var(--yellow-bg); color: var(--yellow); } .attn .ico.blue { background: var(--blue-bg); color: var(--blue); }
    .attn .sub { color: var(--muted); font-size: 13px; } .attn .go { margin-left: auto; color: var(--muted); }
    .attn .empty { padding: 14px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 22px; }
    .kpis.four { grid-template-columns: repeat(4, 1fr); } @media (max-width: 760px) { .kpis.four { grid-template-columns: repeat(2, 1fr); } }
    .kpi { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .kpi .n { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi .l { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .kpi.hot { border-color: color-mix(in srgb, var(--green) 55%, transparent); background: linear-gradient(180deg, var(--green-bg), var(--panel)); } .kpi.hot .n { color: var(--green); }
    .kpi.warn .n { color: var(--red); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .card { position: relative; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .15s, transform .15s, box-shadow .15s; }
    .card:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: var(--shadow); }
    .card-link { position: absolute; inset: 0; border-radius: var(--radius); z-index: 1; }
    .card h3 { font-size: 18px; letter-spacing: -.02em; line-height: 1.25; }
    .card .sub { color: var(--muted); font-size: 13px; }
    .card .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat { background: var(--panel-2); border-radius: 10px; padding: 9px 10px; }
    .stat .n { font-weight: 800; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; } .stat .l { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
    .stat.hot { background: var(--green-bg); } .stat.hot .n { color: var(--green); }
    .bar { height: 6px; background: var(--panel-3); border-radius: 99px; overflow: hidden; } .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); border-radius: 99px; }
    .foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; gap: 8px; flex-wrap: wrap; }

    /* detail segmentu */
    .seg-head { padding: 28px 0 8px; } .seg-head h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); letter-spacing: -.01em; font-family: "Clash Display", Inter, sans-serif; line-height: 1.1; }
    .seg-head .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .notice { margin: 16px 0 0; padding: 12px 16px; border-radius: 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--panel); }
    .notice.red { background: var(--red-bg); border-color: transparent; } .notice.yellow { background: var(--yellow-bg); border-color: transparent; } .notice.blue { background: var(--blue-bg); border-color: transparent; } .notice.green { background: var(--green-bg); border-color: transparent; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 22px 0 20px; scrollbar-width: none; }
    .tab { appearance: none; border: 0; background: none; color: var(--muted); padding: 11px 14px; cursor: pointer; font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; gap: 8px; align-items: center; margin-bottom: -1px; }
    .tab:hover { color: var(--text); } .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--cyan); }
    .tab .c { background: var(--panel-3); color: var(--muted); padding: 0 7px; border-radius: 99px; font-size: 12px; min-width: 20px; text-align: center; }
    .tab .c.hot { background: var(--green); color: var(--on-accent); }

    /* balíčky */
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar .sp { flex: 1; }
    .sel-bar { position: sticky; bottom: 14px; z-index: 15; margin-top: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); }
    .pkg { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
    .pkg.sel { border-color: var(--green); }
    .pkg-head { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; flex-wrap: wrap; }
    .pkg-head .t { flex: 1; min-width: 220px; } .pkg-head h3 { font-size: 17px; letter-spacing: -.015em; line-height: 1.25; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pkg-head .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .pkg-head .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .chk { width: 20px; height: 20px; accent-color: var(--green); margin-top: 3px; flex: none; cursor: pointer; }
    .score { display: inline-grid; place-items: center; min-width: 44px; padding: 3px 9px; border-radius: 9px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--blue-bg); color: var(--blue); }
    .score.A { background: var(--green-bg); color: var(--green); }
    .pkg-body { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line); }
    @media (max-width: 860px) { .pkg-body { grid-template-columns: 1fr; } .stat-row { grid-template-columns: repeat(2, 1fr); } }
    .mail-col { padding: 16px 18px; border-right: 1px solid var(--line); min-width: 0; } @media (max-width: 860px) { .mail-col { border-right: 0; border-bottom: 1px solid var(--line); } }
    .side-col { padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; background: var(--panel-2); }
    .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .mail { background: var(--mail-bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .mail-h { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
    .mail-h b { color: var(--text); font-weight: 600; word-break: break-word; }
    .mail-b { padding: 14px 16px; white-space: pre-wrap; word-break: break-word; font-size: 14.5px; line-height: 1.6; }
    .mail-f { padding: 10px 16px 14px; white-space: pre-wrap; word-break: break-word; color: var(--muted); font-size: 12.5px; border-top: 1px dashed var(--line); }
    .steps { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .step { border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
    .step[aria-pressed="true"] { background: var(--blue-bg); color: var(--blue); border-color: transparent; }
    .quote { border-left: 3px solid var(--cyan); padding: 6px 12px; background: var(--panel); border-radius: 0 8px 8px 0; font-size: 14px; word-break: break-word; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; } .check .m { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 900; margin-top: 2px; }
    .check .m.ok { background: var(--green-bg); color: var(--green); } .check .m.bad { background: var(--red-bg); color: var(--red); } .check .m.na { background: var(--panel-3); color: var(--muted); }
    .warn { color: var(--yellow); font-size: 13px; }
    details.more > summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; list-style: none; } details.more > summary::-webkit-details-marker { display: none; }
    details.more > summary::before { content: "▸ "; } details.more[open] > summary::before { content: "▾ "; }

    /* tabulky */
    .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tbl th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; } .tbl tr:last-child td { border-bottom: 0; } .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--panel-2); }
    .tbl-wrap { overflow-x: auto; }
    .muted { color: var(--muted); } .nowrap { white-space: nowrap; } .right { text-align: right; }
    .empty { padding: 44px 20px; text-align: center; color: var(--muted); } .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
    .list { padding: 6px; } .li { display: flex; gap: 12px; padding: 10px 12px; border-radius: 10px; align-items: baseline; } .li + .li { border-top: 1px solid var(--line); border-radius: 0; }
    .li .when { color: var(--muted); font-size: 12.5px; white-space: nowrap; min-width: 92px; font-variant-numeric: tabular-nums; }
    pre.cmd { margin: 6px 0 0; padding: 10px 12px; background: var(--mail-bg); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; font: 12.5px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
    .steps-list { counter-reset: s; display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; } .steps-list > li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
    .steps-list > li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--blue-bg); color: var(--blue); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
    .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; } .pad { padding: 18px 20px; } .pad h3 { font-size: 15px; margin-bottom: 12px; }

    /* okna a oznámení */
    .overlay { position: fixed; inset: 0; background: rgba(2,8,16,.6); z-index: 50; display: grid; place-items: center; padding: 16px; }
    .modal { width: min(480px, 100%); background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
    .modal h3 { font-size: 18px; margin-bottom: 8px; } .modal p { color: var(--muted); margin-bottom: 14px; } .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .modal textarea, .modal select { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; margin-top: 8px; } .modal textarea { min-height: 80px; resize: vertical; }
    #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: grid; gap: 8px; max-width: min(420px, calc(100% - 32px)); }
    .toast { padding: 12px 16px; border-radius: 12px; background: var(--panel-3); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 14px; animation: in .2s ease-out; }
    .toast.ok { border-color: var(--green); } .toast.bad { border-color: var(--red); }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    .setup { max-width: 760px; margin: 40px auto; padding: 26px; } .setup h2 { margin-bottom: 10px; } .setup ol { padding-left: 20px; display: grid; gap: 10px; }
    .group-title { font: 700 13px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 30px 0 12px; display: flex; gap: 10px; align-items: center; }
    .group-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .area { margin-top: 44px; padding-top: 6px; border-top: 1px solid var(--line-2); }
    .area .group-title { margin-top: 24px; font-size: 14px; color: var(--text); }
    @media (max-width: 560px) { .kpi { padding: 10px 12px; } .kpi .n { font-size: 22px; } .kpis { gap: 8px; } .hero { padding-top: 22px; } .pkg-head { padding: 14px; } .mail-col, .side-col { padding: 14px; } .tbl th, .tbl td { padding: 10px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <header class="top"><div class="top-in" id="top"></div></header>
  <main class="shell" id="app"></main>
  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- pomocné funkce ---------- */
const SEG_URL = '/b2b';
const safeUrl = (u) => (/^(https?:\/\/|#|\?)/i.test(String(u ?? '')) ? String(u) : '#');
function add(el, kids) { for (const k of kids.flat(Infinity)) { if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); } }
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'href') { el.setAttribute('href', safeUrl(v)); if (/^https?:/i.test(v) && !attrs.nolink) { el.target = '_blank'; el.rel = 'noopener noreferrer'; } }
    else if (k === 'nolink') continue;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  add(el, kids);
  return el;
}
const TZ = 'Europe/Prague';
const fmtDT = (iso) => (iso ? new Intl.DateTimeFormat('cs-CZ', { timeZone: TZ, day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)) : '');
const fmtD = (iso) => (iso ? new Intl.DateTimeFormat('cs-CZ', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'numeric' }).format(new Date(iso)) : '');
function ago(iso) {
  if (!iso) return 'nikdy';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'právě teď';
  if (m < 60) return `před ${m} min`;
  const hr = Math.round(m / 60);
  if (hr < 48) return `před ${hr} h`;
  return `před ${Math.round(hr / 24)} dny`;
}
const num = (n) => new Intl.NumberFormat('cs-CZ').format(n ?? 0);
const plural = (n, one, few, many) => (n === 1 ? one : n >= 2 && n <= 4 ? few : many);
const MODE = {
  'dry-run': { label: 'Zkušební režim', tone: '', text: 'Nic se neodesílá. Zprávy se jen připravují a ukazují se tady.' },
  'test-send': { label: 'Test na vlastní adresu', tone: 'yellow', text: 'Zprávy chodí jen na testovací adresu majitele, žádná firma nic nedostane.' },

async function send(segment, action, items, note) {

  const j = await r.json().catch(() => ({}));
