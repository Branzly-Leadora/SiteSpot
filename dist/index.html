<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SiteSpot</title>
  <meta name="description" content="Stavíme weby, které prodávají, a AI automatizace, které šetří čas a peníze. Weby, AI agenti, chatboti a marketing pro firmy, které chtějí růst." />
  <meta name="theme-color" content="#03071a" />
  <link rel="canonical" href="https://sitespot.cz/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />

  <!-- The two weights the hero itself is set in. Preloading them alongside the
       stylesheet means the real typeface is ready for the first paint instead of
       one flash-of-fallback later. -->
  <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/clash-display-400.woff2" as="font" type="font/woff2" crossorigin />
  <!-- The hero still frame: the largest thing in the first viewport, so it is
       fetched at high priority rather than waiting for the video element. Only
       on the widths that actually get the video — phones render the WebGL
       nebula instead and would never use it. -->
  <link rel="preload" href="/media/hero-poster.webp" as="image" type="image/webp" fetchpriority="high" media="(min-width: 861px)" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sitespot.cz/" />
  <meta property="og:title" content="SiteSpot — Proměníme váš web ve stroj na zákazníky" />
  <meta property="og:description" content="Weby, které prodávají. AI automatizace, které šetří čas a peníze. Jeden partner pro celý váš online růst." />
  <meta property="og:image" content="https://sitespot.cz/og.png" />
  <meta property="og:locale" content="cs_CZ" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SiteSpot — Proměníme váš web ve stroj na zákazníky" />
  <meta name="twitter:description" content="Weby, které prodávají. AI automatizace, které šetří čas a peníze." />
  <meta name="twitter:image" content="https://sitespot.cz/og.png" />
  <!-- Analytika (Umami — zdarma, bez cookie lišty): zaregistruj se na https://umami.is,
       přidej web, zkopíruj website-id a odkomentuj řádek níže: -->
  <!-- <script defer src="https://cloud.umami.is/script.js" data-website-id="SEM-VLOZ-WEBSITE-ID"></script> -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "SiteSpot",
    "url": "https://sitespot.cz",
    "email": "max@sitespot.cz",
    "telephone": "+420777123456",
    "description": "Tvorba webů, AI automatizace, AI agenti a výkonnostní marketing pro malé a střední firmy.",
    "areaServed": "CZ",
    "address": { "@type": "PostalAddress", "addressLocality": "Praha", "addressCountry": "CZ" }
  }
  </script>
  <!-- Fonts are self-hosted now (see the @font-face block at the top of
       src/index.css), so the three third-party preconnects that used to sit here
       are gone: nothing is fetched from fontshare or Google any more.
       Spline is only reached if a visitor actually scrolls to the AI-agent
       section, so its connection is warmed lazily rather than on every load. -->
  <link rel="dns-prefetch" href="https://prod.spline.design" />
  <script type="module" crossorigin src="/assets/index-BztqYv_L.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/react-CsxxBGqL.js">
  <link rel="modulepreload" crossorigin href="/assets/lenis-8VXe07GT.js">
  <link rel="modulepreload" crossorigin href="/assets/icons-lEVZH2MD.js">
  <link rel="stylesheet" crossorigin href="/assets/index-BFrDExVL.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
